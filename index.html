<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- not black-translucent: in portrait iOS then sizes the app a status bar short and leaves an empty band at the bottom -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kart Rush">
  <meta name="theme-color" content="#1b1f3a">
  <title>Kart Rush</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <!-- #app is always laid out landscape; in portrait it is rotated 90deg -->
  <div id="app">
    <canvas id="game"></canvas>

    <!-- ===== HUD (non-interactive) ===== -->
    <div id="hud">
      <canvas id="minimap"></canvas>
      <div id="lapbox"><span class="label">LAP</span><span id="lap">1/3</span></div>

      <div id="hud-top">
        <div class="pill"><span class="label">TIME</span><span id="time">0:00.00</span></div>
        <div class="pill"><span class="label">BEST</span><span id="best">--:--.--</span></div>
      </div>

      <div id="place" hidden><span id="place-num">6</span><span id="place-suffix">th</span><small id="place-of">/6</small></div>

      <div id="message"></div>
      <div id="split"></div>
      <div id="tip"></div>
      <div id="wrongway" hidden>WRONG WAY</div>
      <div id="warn" hidden>!</div>
      <div id="perf" hidden></div>
      <div id="countdown"></div>

      <div id="speedo">
        <span id="speed">0</span><small>km/h</small>
        <div id="drift-bar"><div id="drift-fill"></div></div>
      </div>
    </div>

    <!-- ===== Touch controls ===== -->
    <div id="controls">
      <div id="steer">
        <button id="btn-left" class="ctl steer-btn" aria-label="Steer left">&#9664;</button>
        <button id="btn-right" class="ctl steer-btn" aria-label="Steer right">&#9654;</button>
      </div>
      <!-- Joystick steering (Settings): shown instead of the arrows -->
      <div id="joystick" aria-label="Steering joystick"><div id="stick-base"><div id="stick-knob"></div></div></div>

      <button id="btn-item" class="ctl" aria-label="Use item" data-item=""></button>

      <div id="pedals">
        <button id="btn-brake" class="ctl pedal" aria-label="Brake / Reverse">BRAKE<small>REV</small></button>
        <button id="btn-gas" class="ctl pedal" aria-label="Gas">GAS</button>
      </div>

      <button id="btn-reset" aria-label="Reset kart">&#x21BB;</button>
      <button id="btn-pause" class="round-btn" aria-label="Pause"></button>
    </div>

    <!-- ===== Menu / results overlay ===== -->
    <div id="overlay">
      <!-- Lobby: header (profile, settings), logo + START on the left, the open middle frames the player's kart
           (lobby camera, updateCamera), RACE SETUP on the right (each card opens #pick-screen) -->
      <div id="menu-screen" class="screen lobby">
        <div class="lobby-top">
          <button id="hello-edit" class="chip" hidden></button>
          <button class="chip btn-settings"><i data-icon="gear"></i>SETTINGS</button>
        </div>
        <div class="lobby-main">
          <div class="lobby-cta">
            <h1>KART<span>RUSH</span></h1>
            <p class="race-pill">3 laps &middot; 5 rivals &middot; you start last</p>
            <button id="btn-start" class="btn-primary btn-start">START RACE</button>
          </div>
          <div class="lobby-stage"></div>
          <div class="card setup">
            <div class="setup-title">RACE SETUP</div>
            <button class="setup-track" data-pick="track">
              <span class="pick-art"></span>
              <span class="pick-text"><small>TRACK</small><b></b><em></em></span>
              <span class="chev">&#8250;</span>
              <span class="setup-record" id="menu-record"></span>
            </button>
            <div class="setup-pair">
              <button class="setup-tile" data-pick="driver"><small>DRIVER</small><span class="pick-art"></span><b></b><em class="driver-tag"></em></button>
              <button class="setup-tile" data-pick="kart"><small>PAINT</small><span class="pick-art"></span><b></b><em class="swatches"></em></button>
            </div>
          </div>
        </div>
        <p id="build"></p>
      </div>

      <!-- First launch (or EDIT from the title): name + age, saved per device (kartrush.profile) -->
      <div id="hello-screen" class="screen screen-col" hidden>
        <div class="pick-title">HELLO, RACER!</div>
        <form id="hello-form" class="hello-form" autocomplete="off" novalidate>
          <label class="field"><span class="setting-label">YOUR NAME</span>
            <input id="hello-name" type="text" maxlength="12" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="Name"></label>
          <label class="field field-age"><span class="setting-label">AGE</span>
            <input id="hello-age" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" enterkeyhint="go" placeholder="Age"></label>
          <button type="submit" hidden></button>
        </form>
        <p id="hello-error" class="hello-error"></p>
        <button id="btn-hello" class="btn-primary">LET'S RACE</button>
      </div>

      <!-- Track / driver / kart picker (filled by openPicker). Driver + paint: split stage (.staged): the live 3D
           kart on the open left (#pick-stage: drag to turn it), the cards on the right -->
      <div id="pick-screen" class="screen screen-col" hidden>
        <div id="pick-stage" class="pick-stage">
          <div class="stage-label"><b id="stage-name"></b><small id="stage-tag"></small></div>
        </div>
        <div class="pick-panel">
          <div id="pick-title" class="pick-title"></div>
          <div id="pick-list" class="pick-list"></div>
          <button id="btn-pick-done" class="btn-primary">DONE</button>
        </div>
      </div>

      <!-- After the race -->
      <div id="results-screen" class="screen" hidden>
        <div class="side">
          <div id="res-place" class="big-place"></div>
          <div class="stats">
            <div><span>TIME</span><b id="res-time"></b></div>
            <div><span>BEST LAP</span><b id="res-lap"></b></div>
          </div>
          <p id="res-record" class="record"></p>
          <div class="btn-row">
            <button id="btn-again" class="btn-primary">RACE AGAIN</button>
            <button id="btn-menu" class="btn-secondary">MENU</button>
          </div>
        </div>
        <div class="card"><table id="standings" class="standings"></table></div>
      </div>
      <!-- Paused -->
      <div id="pause-screen" class="screen" hidden>
        <div class="side">
          <div class="paused">PAUSED</div>
          <button id="btn-resume" class="btn-primary">RESUME</button>
          <div class="btn-row">
            <button id="btn-restart" class="btn-secondary">RESTART</button>
            <button id="btn-quit" class="btn-secondary">MENU</button>
          </div>
          <button class="btn-small btn-settings"><i data-icon="gear"></i>SETTINGS</button>
        </div>
      </div>
      <!-- Settings (from the title or pause screen; saved per device) -->
      <div id="settings-screen" class="screen screen-col" hidden>
        <div class="pick-title">SETTINGS</div>
        <div class="card settings-card">
          <div class="setting-row">
            <div class="setting">
              <span class="setting-label">STEERING</span>
              <div id="steer-pick" class="track-pick">
                <button class="trk" data-steer="buttons"><i data-icon="arrows"></i>Buttons</button>
                <button class="trk" data-steer="joystick"><i data-icon="joystick"></i>Joystick</button>
              </div>
            </div>
            <div class="setting">
              <span class="setting-label">ALL SOUND</span>
              <div id="mute-pick" class="track-pick">
                <button class="trk" data-muted="0"><i data-icon="speaker"></i>On</button>
                <button class="trk" data-muted="1"><i data-icon="muted"></i>Off</button>
              </div>
            </div>
          </div>
          <!-- dimmed while ALL SOUND is off -->
          <div id="volume-row" class="setting-row">
            <div class="setting">
              <span class="setting-label">MUSIC</span>
              <div class="track-pick vol-pick" data-bus="music">
                <button class="trk" data-vol="0">Off</button>
                <button class="trk" data-vol="0.35">Low</button>
                <button class="trk" data-vol="0.65">Mid</button>
                <button class="trk" data-vol="1">Full</button>
              </div>
            </div>
            <div class="setting">
              <span class="setting-label">SOUND EFFECTS</span>
              <div class="track-pick vol-pick" data-bus="sfx">
                <button class="trk" data-vol="0">Off</button>
                <button class="trk" data-vol="0.35">Low</button>
                <button class="trk" data-vol="0.65">Mid</button>
                <button class="trk" data-vol="1">Full</button>
              </div>
            </div>
          </div>
        </div>
        <button id="btn-settings-back" class="btn-primary">BACK</button>
      </div>
      <div id="confetti" aria-hidden="true"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
